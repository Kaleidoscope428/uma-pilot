[package]
name = "uma-pilot"
version = "0.1.0"
edition = "2021"
description = "A safe, local desktop automation assistant for Uma Musume"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
image = "0.25"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

